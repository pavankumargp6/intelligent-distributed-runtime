name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Show compiler version
        run: gcc --version

      - name: make
        run: make

      - name: make asan
        run: make asan

      - name: make test
        run: make test

      - name: Upload coordinator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-log
          path: /tmp/idr_coord_*.log
          if-no-files-found: ignore
